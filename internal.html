<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>和美小玉家｜內部系統</title>
<link rel="apple-touch-icon" href="https://hemeiyubakes.github.io/hemeiyubakes/assets/apple-touch-icon-internal.png">
<link rel="icon" type="image/png" href="https://hemeiyubakes.github.io/hemeiyubakes/assets/apple-touch-icon-internal.png">
<meta name="apple-mobile-web-app-title" content="和美內部">
<link rel="manifest" href="manifest-internal.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#D32F2F">
<!-- internal.html v7：狀態管理簡化、移除訊息範本、口味底色、商品列格式｜v6：移除 LIFF 相關欄位與商品圖片、新增「未提供」電話、當日明細改為口味×盒型盒數 -->

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #f4f4f4; color: #333; padding: 15px;
    max-width: 900px; margin: 0 auto;
  }
  h1 { font-size: 20px; margin-bottom: 12px; color: #D32F2F; text-align: center; }
  h2 { font-size: 16px; margin: 0 0 10px; color: #D32F2F; }
  h3 { font-size: 14px; color: #D32F2F; margin: 0 0 10px; }
  .card { background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 12px; }
  label { display: block; font-weight: bold; margin-bottom: 6px; color: #D32F2F; font-size: 14px; }
  input, select, textarea {
    width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 16px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #D32F2F; }
  .row { margin-bottom: 12px; }
  .row-flex { display: flex; gap: 8px; }
  button {
    background: #D32F2F; color: #fff; border: none; padding: 10px 16px;
    border-radius: 8px; font-size: 15px; cursor: pointer; font-family: inherit;
  }
  button.small { padding: 6px 12px; font-size: 13px; }
  button.outline { background: #fff; color: #D32F2F; border: 1px solid #D32F2F; }
  button.gray { background: #888; }
  .hint { font-size: 12px; color: #888; margin-top: 4px; }
  .customer-info { background: #fff8f8; border-left: 3px solid #D32F2F; padding: 8px 12px; margin-top: 8px; font-size: 13px; border-radius: 4px; }
  .tab-nav { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab-btn { flex: 1; background: #eee; color: #666; border-radius: 10px 10px 0 0; padding: 12px 8px; font-weight: bold; font-size: 14px; }
  .tab-btn.active { background: #D32F2F; color: #fff; }
  .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .product-card { border: 2px solid #eee; border-radius: 10px; overflow: hidden; }
  .product-card.selected { border-color: #D32F2F; background: #fffafa; }
  .product-info { padding: 10px; }
  .product-name { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 4px; }
  .product-price { font-size: 13px; color: #D32F2F; margin-bottom: 6px; }
  .product-limit { font-size: 11px; color: #888; margin-bottom: 6px; }
  .qty-row { display: flex; align-items: center; gap: 6px; }
  .qty-btn { width: 32px; height: 32px; border: 1px solid #ddd; border-radius: 6px; background: #f5f5f5; font-size: 16px; cursor: pointer; color: #333; padding: 0; }
  .qty-input { width: 46px; text-align: center; padding: 4px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
  .promo-section { background: #fffae6; border-radius: 10px; padding: 14px; border: 1px solid #ffe082; }
  .promo-title { font-weight: bold; color: #f57c00; margin-bottom: 10px; font-size: 14px; }
  .promo-item { background: #fff; padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 13px; color: #f57c00; }
  .addon-section { background: #fff8f0; border-radius: 10px; padding: 14px; border: 1px solid #ffe0c0; }
  .addon-title { font-weight: bold; color: #D32F2F; margin-bottom: 10px; font-size: 14px; }
  .addon-item { margin-bottom: 12px; }
  .addon-name { font-weight: bold; color: #333; font-size: 14px; margin-bottom: 4px; }
  .addon-desc { font-size: 12px; color: #888; margin-bottom: 6px; }
  .addon-auto-info { font-size: 13px; color: #4caf50; background: #f0f9f0; padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; }
  .addon-selectable { background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #eee; }
  .addon-selectable-prompt { font-size: 13px; color: #555; margin-bottom: 6px; }
  .addon-selectable-row { display: flex; align-items: center; gap: 8px; }
  .addon-limit-hint { font-size: 12px; color: #888; }
  .subtotal-box { background: #fff8f8; border-radius: 10px; padding: 12px; font-size: 14px; }
  .subtotal-row { display: flex; justify-content: space-between; padding: 4px 8px; border-radius: 4px; }
  .subtotal-row.gift-row { background: #fff5f5; color: #D32F2F; }
  .gift-source { color: #888; font-size: 12px; font-weight: normal; }
  .subtotal-total { font-weight: bold; font-size: 16px; color: #D32F2F; border-top: 1px solid #eee; padding-top: 6px; margin-top: 6px; }
  .btn-submit { width: 100%; padding: 14px; font-size: 16px; border-radius: 25px; font-weight: bold; }
  .prep-alert { background: #ffebee; border: 2px solid #D32F2F; border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; color: #D32F2F; font-weight: bold; display: flex; align-items: center; gap: 8px; }
  .prep-alert.hidden { display: none; }
  .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
  .calendar-header button { padding: 6px 12px; }
  .calendar-title { flex: 1; text-align: center; font-weight: bold; font-size: 16px; color: #D32F2F; }
  .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 4px; }
  .calendar-weekdays > div { text-align: center; padding: 6px 2px; background: #f0f0f0; font-size: 12px; font-weight: bold; color: #666; border-radius: 4px; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; width: 100%; }
  .day-cell { min-height: 100px; min-width: 0; background: #fafafa; border-radius: 4px; padding: 4px; font-size: 12px; cursor: pointer; transition: background 0.15s; border: 1px solid transparent; display: flex; flex-direction: column; overflow: hidden; }
  .day-cell.other-month { opacity: 0.35; }
  .day-cell.today { background: #fff3e0; border-color: #ff9800; }
  .day-cell.target-mode { background: #e3f2fd; border-color: #1976d2; cursor: cell; }
  .day-cell.target-mode:hover { background: #bbdefb; }
  .day-cell.load-low { background: #eef7ee; }
  .day-cell.load-mid { background: #fdf6e3; }
  .day-cell.load-high { background: #fdeceb; }
  .day-cell.load-over { background: #fbdedb; }
  .day-number { font-weight: bold; color: #555; }
  .day-cell.today .day-number { color: #e65100; }
  .day-orders { margin-top: 4px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  /* 月曆名字條：左邊色條與當日明細的圓點同一套顏色 */
  .day-order-chip { background: #fff; padding: 3px 5px; border-radius: 3px; font-size: 10px; border-left: 3px solid #e6a417; line-height: 1.3; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .day-order-chip.paid { border-left-color: #6cbf4b; }
  .day-order-chip.done { border-left-color: #9e9e9e; color: #999; }
  .day-order-chip:hover { background: #fff8f8; }
  .order-list { display: flex; flex-direction: column; gap: 8px; }
  .order-card { background: #fafafa; border: 2px solid #eee; border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: all 0.15s; }
  .order-card:hover { border-color: #ccc; }
  .order-card.selected { border-color: #D32F2F; background: #fff5f5; }
  .order-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 13px; }
  .order-card-id { color: #888; font-weight: bold; }
  .order-card-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #e0e0e0; color: #555; }
  .order-card-tag.ship { background: #e3f2fd; color: #1976d2; }
  .order-card-tag.pickup { background: #f3e5f5; color: #7b1fa2; }
  .order-card-name { font-weight: bold; font-size: 14px; color: #333; }
  .order-card-items { font-size: 12px; color: #666; margin-top: 2px; white-space: pre-line; }
  .info-btn-sm { width: 22px; height: 22px; line-height: 22px; border-radius: 50%; background: #e0e0e0; color: #666; text-align: center; font-size: 12px; cursor: pointer; display: inline-block; }
  .info-btn-sm:hover { background: #ccc; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal-box { background: #fff; border-radius: 15px; padding: 20px; max-width: min(460px, 92vw); width: 100%; max-height: 88vh; overflow-y: auto; position: relative; }
  .modal-close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; border: none; background: #f0f0f0; cursor: pointer; font-size: 15px; color: #666; }
  .detail-section { background: #fafafa; padding: 10px 12px; border-radius: 8px; margin: 10px 0; font-size: 13px; line-height: 1.7; color: #555; }
  .pickup-display { background: #fff8e7; padding: 10px 12px; border-radius: 8px; margin: 10px 0; font-size: 13px; }
  .status-section { border-top: 1px solid #eee; margin-top: 14px; padding-top: 14px; }
  .status-checkbox { display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; font-size: 14px; }
  .status-checkbox input { width: auto; margin: 0; transform: scale(1.2); cursor: pointer; }
  .status-tracking { margin: 8px 0 8px 30px; }
  .status-tracking input { padding: 6px 10px; font-size: 14px; }
  /* 訂單詳情：商品列 */
  .item-list { margin: 4px 0 2px; display: flex; flex-direction: column; gap: 5px; }
  .item-row { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 8px; padding: 6px 8px; line-height: 1.3; }
  .flavor-pill { flex: 0 0 auto; padding: 2px 9px; border-radius: 10px; font-size: 13px; font-weight: bold; color: #333; }
  .item-box { flex: 1; min-width: 0; font-size: 14px; color: #333; font-weight: bold; }
  .item-qty { flex: 0 0 auto; font-size: 16px; font-weight: bold; color: #D32F2F; }
  .item-amt { flex: 0 0 auto; font-size: 12px; color: #888; min-width: 62px; text-align: right; }

  /* ===== 當日明細：左客人、右口味卡片 ===== */
  .day-summary { display: flex; gap: 10px; background: #fafafa; border-radius: 12px; padding: 10px; margin-bottom: 6px; align-items: flex-start; }
  .day-sum-left { flex: 0 0 40%; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .cust-chip { background: #fbe0b5; border-radius: 8px; padding: 7px 9px; font-size: 13px; display: flex; align-items: center; gap: 7px; cursor: pointer; min-width: 0; }
  .cust-chip:hover { background: #f8d49b; }
  .cust-dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
  .cust-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day-sum-right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .flavor-card { background: #e6e8e8; border-radius: 12px; padding: 10px 12px; }
  .flavor-main { display: flex; align-items: center; gap: 12px; }
  .flavor-name { display: flex; flex-direction: column; align-items: center; font-size: 20px; line-height: 1.15; font-weight: bold; color: #222; flex: 0 0 auto; }
  .flavor-boxes { font-size: 13px; font-weight: bold; color: #222; line-height: 1.6; min-width: 0; }
  .flavor-boxes .box-row { display: flex; gap: 8px; }
  .flavor-boxes .box-qty { font-size: 15px; }
  .flavor-cap { font-size: 11px; font-weight: bold; margin-top: 6px; padding-top: 5px; border-top: 1px dashed #c4c7c7; }
  .day-total-cap { font-size: 12px; font-weight: bold; text-align: right; padding: 2px 4px; }
  .dot-legend { font-size: 11px; color: #888; display: flex; gap: 10px; flex-wrap: wrap; margin: 0 2px 10px; }
  .dot-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .dot-legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  #loginScreen, #mainForm { display: none; }
  .error { color: #c33; font-size: 13px; margin-top: 6px; }
  .success { color: #2a7; font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>

<h1>🍪 和美小玉家｜內部系統</h1>

<div id="loginScreen" class="card">
  <h2>請輸入密碼</h2>
  <div class="row"><input type="password" id="pwInput" placeholder="內部填單密碼" autocomplete="off"></div>
  <button onclick="doLogin()">進入</button>
  <div id="loginMsg" class="error"></div>
</div>

<div id="mainForm">
  <div class="tab-nav">
    <button class="tab-btn active" id="tab-btn-form" onclick="switchTab('form')">📝 內部填單</button>
    <button class="tab-btn" id="tab-btn-schedule" onclick="switchTab('schedule')">📅 排單系統</button>
  </div>

  <div id="tab-form">
    <div class="card">
      <h2>客戶資料</h2>
      <div class="row">
        <label>📞 電話 <span style="color:#888;font-weight:normal;font-size:11px">（選填）</span></label>
        <div class="row-flex">
          <input type="tel" id="phone" placeholder="0912-345-678" style="flex:1;min-width:0">
          <button class="small outline" onclick="fillPhoneTag('熟客')" style="flex:0 0 auto" title="一鍵填入「熟客」">熟客</button>
          <button class="small outline" onclick="fillPhoneTag('未提供')" style="flex:0 0 auto" title="客人沒有提供電話">未提供</button>
          <button class="small" onclick="lookupCustomer()" style="flex:0 0 auto">查歷史</button>
        </div>
        <div id="customerInfo"></div>
      </div>
      <div class="row"><label>👤 姓名 <span style="color:#c33">*</span></label><input type="text" id="name"></div>
      <div class="row"><label>📍 地址</label><input type="text" id="address"></div>
      <div class="row">
        <label>📌 訂單來源 <span style="color:#c33">*</span></label>
        <select id="orderSource">
          <option value="">請選擇</option>
          <option value="LINE 私訊">LINE 私訊</option>
          <option value="電話訂購">電話訂購</option>
          <option value="現場下單">現場下單</option>
          <option value="FB 私訊">FB 私訊</option>
          <option value="親友介紹">親友介紹</option>
          <option value="市集現場">市集現場</option>
          <option value="其他">其他</option>
        </select>
      </div>
    </div>
    <div class="card"><h2>🛍 商品</h2><div class="product-grid" id="productGrid">載入中...</div></div>
    <div class="card" id="promoSection" style="display:none"><div class="promo-section"><div class="promo-title">🎉 優惠進度</div><div id="promoItems"></div></div></div>
    <div class="card" id="addonSection" style="display:none"><div class="addon-section"><div class="addon-title">🎁 贈品</div><div id="addonItems"></div></div></div>
    <div class="card" id="subtotalBox" style="display:none">
      <h2>💰 訂單明細</h2>
      <div class="subtotal-box">
        <div id="subtotalItems"></div>
        <div id="subtotalGifts"></div>
        <div class="subtotal-row subtotal-total"><span>總金額</span><span id="totalAmt">0 元</span></div>
      </div>
      <div class="hint">⚠️ 最終金額以後端寫入 Orders 表為準</div>
    </div>
    <div class="card">
      <h2>🚚 運送與付款</h2>
      <div class="row"><label>運送方式</label><select id="shippingSelect"><option value="現場取貨">現場取貨</option><option value="宅配">宅配</option></select></div>
      <div class="row"><label>付款方式</label><select id="paymentSelect"><option value="現場付款">現場付款</option><option value="匯款">匯款</option></select></div>
    </div>
    <div class="card"><h2>✍️ 備註</h2><textarea id="note" rows="2" placeholder="（選填）"></textarea></div>
    <div class="card"><button class="btn-submit" id="submitBtn" onclick="submitOrder()">送出訂單</button><div id="submitMsg" class="error"></div></div>
  </div>

  <div id="tab-schedule" style="display:none">
    <div id="prepAlert" class="prep-alert hidden"></div>
    <div class="card">
      <div class="calendar-header">
        <button class="small outline" onclick="prevMonth()">‹ 上月</button>
        <div class="calendar-title" id="calendarTitle"></div>
        <button class="small outline" onclick="nextMonth()">下月 ›</button>
      </div>
      <div class="calendar-weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
    <div class="card">
      <h2>📋 待排定訂單 <span id="unscheduledCount" style="color:#888;font-size:13px;font-weight:normal"></span></h2>
      <div class="hint" id="scheduleHint">點訂單卡片，再點月曆日期即可排定（點 ⓘ 看詳情）</div>
      <div class="order-list" id="unscheduledList" style="margin-top:10px"></div>
    </div>
    <div class="card"><button class="outline" onclick="loadSchedule()">🔄 重新整理</button></div>
  </div>
</div>

<!-- 時段選擇 modal -->
<div id="periodModal" class="modal-overlay" onclick="closePeriodModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closePeriodModal()">✕</button>
    <h2 style="margin-bottom:12px">📅 設定取貨日期</h2>
    <div id="periodModalInfo" style="background:#fafafa;padding:10px;border-radius:6px;margin-bottom:12px;font-size:14px"></div>
    <div class="row"><label>取貨時段</label><select id="periodSelect"></select></div>
    <div style="display:flex;gap:8px">
      <button class="outline" style="flex:1" onclick="closePeriodModal()">取消</button>
      <button style="flex:1" onclick="confirmSchedule()">確定排定</button>
    </div>
    <div id="periodModalMsg" class="error"></div>
  </div>
</div>

<!-- 當日訂單瀏覽 modal -->
<div id="dayDetailModal" class="modal-overlay" onclick="closeDayDetail(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeDayDetail()">✕</button>
    <h2 id="dayDetailTitle" style="margin-bottom:12px"></h2>
    <div id="dayDetailSummary"></div>
    <div class="order-list" id="dayDetailList"></div>
  </div>
</div>

<!-- 訂單詳情 modal -->
<div id="orderDetailModal" class="modal-overlay" onclick="closeOrderDetail(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeOrderDetail()">✕</button>
    <h2 id="detailTitle" style="margin-bottom:8px"></h2>
    <div id="detailInfo" class="detail-section"></div>
    <div style="margin:8px 0"><button class="small outline" onclick="toggleEditItems()">✏️ 編輯商品/數量/備註</button></div>
    <div id="editItemsSection" style="display:none;background:#fafafa;border-radius:8px;padding:10px 12px;margin-bottom:10px">
      <h3>✏️ 編輯商品/數量/備註</h3>
      <div class="product-grid" id="editProductGrid"></div>
      <div class="subtotal-box" id="editSubtotalBox" style="margin-top:10px"></div>
      <div class="row" style="margin-top:10px"><label>備註</label><textarea id="editNote" rows="2"></textarea></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="outline" style="flex:1" onclick="cancelEditItems()">取消</button>
        <button style="flex:1" onclick="saveEditItems()">儲存修改</button>
      </div>
      <div id="editItemsMsg" class="hint" style="margin-top:6px"></div>
    </div>
    <div id="detailPickup"></div>
    <div class="status-section">
      <h3>📋 狀態管理（勾選即儲存）</h3>
      <div id="statusControls"></div>
    </div>
    <div id="detailMsg" class="hint" style="margin-top:8px;min-height:18px"></div>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw4v_VjIH_DXQl1ExU0n0qFevQX63OItw-ehfCzqXuMI3qqdE75EeXFnO880KDKJCZW/exec';

// 電話欄的特殊標記（不是真的電話）
const PHONE_TAGS = ['熟客', '未提供'];
// 圓點 / 月曆色條顏色
const DOT_COLORS = { unpaid: '#e6a417', paid: '#6cbf4b', done: '#9e9e9e' };
// 口味底色（用「包含」比對，所以「南瓜籽 / 南瓜子」都會對到）。新增口味在這裡加一行即可
const FLAVOR_COLORS = [
  { key: '杏仁', color: '#fde3c4' },  // 淺橘
  { key: '南瓜', color: '#dcedc8' }   // 淺綠
];
const FLAVOR_COLOR_DEFAULT = '#e6e8e8';
function flavorColor(flavor) {
  const f = String(flavor || '');
  for (let i = 0; i < FLAVOR_COLORS.length; i++) {
    if (f.indexOf(FLAVOR_COLORS[i].key) >= 0) return FLAVOR_COLORS[i].color;
  }
  return FLAVOR_COLOR_DEFAULT;
}

let productsData = [], addonsData = [], promotionsData = [], addonSelections = {};
let scheduleData = null, selectedOrderId = null, calendarYear, calendarMonth, pendingDate = null, detailOrder = null;

async function doLogin() {
  const pw = document.getElementById('pwInput').value.trim();
  if (!pw) return;
  const msg = document.getElementById('loginMsg');
  msg.textContent = '驗證中...';
  try {
    const res = await callServer('verifyInternalPassword', { password: pw });
    if (res === true) {
      PASSWORD = pw;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainForm').style.display = 'block';
      await loadData();
    } else { msg.textContent = '密碼錯誤'; }
  } catch (e) { msg.textContent = '連線失敗：' + e.message; }
}

async function loadData() {
  try {
    const data = await callServer('getInitData', {});
    productsData = data.products || [];
    addonsData = data.addons || [];
    promotionsData = data.promotions || [];
    if (data.settings) applyInitSettings(data.settings);
    renderProducts();
    refreshAll();
  } catch (e) { alert('載入失敗：' + e.message); }
}

function applyInitSettings(s) {
  // 訂單來源選項動態化
  var sourceStr = s['訂單來源選項'];
  if (sourceStr) {
    var sources = String(sourceStr).split(',').map(x => x.trim()).filter(x => x);
    const sel = document.getElementById('orderSource');
    if (sel) {
      sel.innerHTML = '<option value="">請選擇</option>';
      sources.forEach(src => {
        const opt = document.createElement('option');
        opt.value = src;
        opt.textContent = src;
        sel.appendChild(opt);
      });
    }
  }
}
function renderProducts() {
  const grid = document.getElementById('productGrid');
  if (productsData.length === 0) { grid.innerHTML = '無商品'; return; }
  grid.innerHTML = '';
  productsData.forEach((p, i) => {
    const limitText = p.maxQty > 0 ? `<div class="product-limit">限購 ${p.maxQty} 個</div>` : '';
    const maxAttr = p.maxQty > 0 ? `max="${p.maxQty}"` : '';
    grid.innerHTML += `<div class="product-card" id="card_${i}"><div class="product-info"><div class="product-name">${p.name}</div><div class="product-price">NT$ ${p.price}</div>${limitText}<div class="qty-row"><button class="qty-btn" onclick="changeQty(${i},-1)">－</button><input class="qty-input" id="qty_${i}" type="number" value="0" min="0" ${maxAttr} onchange="onQtyChange(${i})"><button class="qty-btn" onclick="changeQty(${i},1)">＋</button></div></div></div>`;
  });
}
function changeQty(i, delta) {
  const input = document.getElementById('qty_' + i);
  const max = productsData[i].maxQty;
  let val = Math.max(0, parseInt(input.value || 0) + delta);
  if (max > 0) val = Math.min(val, max);
  input.value = val;
  document.getElementById('card_' + i).classList.toggle('selected', val > 0);
  refreshAll();
}
function onQtyChange(i) {
  const input = document.getElementById('qty_' + i);
  const max = productsData[i].maxQty;
  let val = parseInt(input.value);
  if (isNaN(val) || val < 0) val = 0;
  if (max > 0 && val > max) val = max;
  input.value = val;
  document.getElementById('card_' + i).classList.toggle('selected', val > 0);
  refreshAll();
}
function refreshAll() { renderAddons(); renderPromotions(); updateTotal(); }
function parseGiftRules(rulesStr) {
  if (!rulesStr) return [];
  return rulesStr.split(',').map(r => {
    const parts = r.split(':').map(s => s.trim());
    if (parts.length < 3) return null;
    return { type: parts[0], mode: parts[1], n: parseInt(parts[2]) || 1 };
  }).filter(r => r);
}
function calcAddonForProduct(addon) {
  const rules = parseGiftRules(addon.giftRules);
  let autoGifted = 0, maxSelectable = 0;
  const autoTypes = [], selectTypes = [];
  rules.forEach(rule => {
    let matchingQty = 0;
    productsData.forEach((p, i) => {
      if (p.type === rule.type) {
        const qty = parseInt(document.getElementById('qty_' + i)?.value || 0);
        if (qty > 0) matchingQty += qty;
      }
    });
    if (rule.mode === 'auto') {
      const gift = Math.floor(matchingQty / rule.n);
      autoGifted += gift;
      if (gift > 0) autoTypes.push({ type: rule.type, qty: matchingQty, gift, n: rule.n });
    } else if (rule.mode === '選擇') {
      const maxSel = Math.floor(matchingQty / rule.n);
      maxSelectable += maxSel;
      if (maxSel > 0) selectTypes.push({ type: rule.type, qty: matchingQty, max: maxSel });
    }
  });
  let userSelected = addonSelections[addon.name] || 0;
  userSelected = Math.max(0, Math.min(userSelected, maxSelectable));
  if (addon.maxQty) userSelected = Math.min(userSelected, addon.maxQty);
  addonSelections[addon.name] = userSelected;
  return { autoGifted, maxSelectable, userSelected, totalGifted: autoGifted + userSelected, autoTypes, selectTypes };
}
function shouldShowAddon(addon) {
  const cond = (addon.showCondition || 'always').trim();
  if (cond === 'always') return true;
  if (cond.startsWith('有')) {
    const type = cond.substring(1);
    return productsData.some((p, i) => p.type === type && parseInt(document.getElementById('qty_' + i)?.value || 0) > 0);
  }
  return true;
}
function renderAddons() {
  const section = document.getElementById('addonSection');
  const container = document.getElementById('addonItems');
  const anySelected = productsData.some((p, i) => parseInt(document.getElementById('qty_' + i)?.value || 0) > 0);
  if (!anySelected || addonsData.length === 0) { section.style.display = 'none'; return; }
  let anyAddonShown = false, html = '';
  addonsData.forEach(addon => {
    if (!shouldShowAddon(addon)) return;
    const calc = calcAddonForProduct(addon);
    const hasAuto = calc.autoGifted > 0, hasSelectable = calc.maxSelectable > 0;
    if (!hasAuto && !hasSelectable) return;
    anyAddonShown = true;
    let h = '<div class="addon-item">';
    h += `<div class="addon-name">📦 ${addon.name}</div>`;
    if (addon.description) h += `<div class="addon-desc">${addon.description}</div>`;
    if (hasAuto) {
      const autoDesc = calc.autoTypes.map(t => `${t.type} ${t.qty} 個贈 ${t.gift} 個`).join('、');
      h += `<div class="addon-auto-info">✨ 自動贈送：${calc.autoGifted} 個（${autoDesc}）</div>`;
    }
    if (hasSelectable) {
      const selectDesc = calc.selectTypes.map(t => t.type).join('、');
      h += `<div class="addon-selectable"><div class="addon-selectable-prompt">有送禮需求嗎？選擇 ${selectDesc} 需要的紙袋數量</div><div class="addon-selectable-row"><button class="qty-btn" onclick="changeAddonQty('${addon.name}', -1)">－</button><input class="qty-input" id="addon_${addon.name}" type="number" value="${calc.userSelected}" min="0" max="${calc.maxSelectable}" onchange="onAddonInputChange('${addon.name}')"><button class="qty-btn" onclick="changeAddonQty('${addon.name}', 1)">＋</button><span class="addon-limit-hint">最多 ${calc.maxSelectable} 個</span></div></div>`;
    }
    h += '</div>';
    html += h;
  });
  section.style.display = anyAddonShown ? 'block' : 'none';
  container.innerHTML = html;
}
function changeAddonQty(addonName, delta) {
  const input = document.getElementById('addon_' + addonName);
  if (!input) return;

function onAddonInputChange(addonName) {

function calcPromotions() {
  const items = getSelectedItems();
  const results = [];
  promotionsData.forEach(promo => {
    let qualifyQty = 0, qualifyAmount = 0, giftQty = 0, triggered = false, remaining = 0;
    if (promo.conditionType === '滿件') {
      const cps = promo.conditionProduct ? promo.conditionProduct.split(',').map(s => s.trim()) : [];
      let matched = 0;
      items.forEach(item => { if (cps.length === 0 || cps.indexOf(item.name) >= 0) matched += item.qty; });
      qualifyQty = matched;
      if (matched >= promo.conditionQty && promo.conditionQty > 0) {
        triggered = true;
        giftQty = promo.multipleTrigger ? Math.floor(matched / promo.conditionQty) * promo.giftQty : promo.giftQty;
      } else { remaining = promo.conditionQty - matched; }
    } else if (promo.conditionType === '滿額') {
      const cps = promo.conditionProduct ? promo.conditionProduct.split(',').map(s => s.trim()) : [];
      let matched = 0;
      items.forEach(item => { if (cps.length === 0 || cps.indexOf(item.name) >= 0) matched += (item.price || 0) * item.qty; });
      qualifyAmount = matched;
      if (matched >= promo.conditionAmount && promo.conditionAmount > 0) {
        triggered = true;
        giftQty = promo.multipleTrigger ? Math.floor(matched / promo.conditionAmount) * promo.giftQty : promo.giftQty;
      } else { remaining = promo.conditionAmount - matched; }
    }
    results.push({ promo, qualifyQty, qualifyAmount, giftQty, triggered, remaining });
  });
  return results;
}
function renderPromotions() {
  const section = document.getElementById('promoSection');
  const container = document.getElementById('promoItems');
  const results = calcPromotions();
  let html = '', anyShown = false;
  results.forEach(r => {
    if (r.triggered) return;
    const threshold = r.promo.progressThreshold || 0;
    if (threshold > 0 && r.remaining > 0 && r.remaining <= threshold) {
      const unit = r.promo.conditionType === '滿額' ? '元' : '個';
      html += `<div class="promo-item">✨ 再買 ${r.remaining} ${unit}就達「${r.promo.name}」</div>`;
      anyShown = true;
    }
  });
  section.style.display = anyShown ? 'block' : 'none';
  container.innerHTML = html;
}
function buildGiftRowsHtml() {
  let html = '';
  addonsData.forEach(addon => {
    if (!shouldShowAddon(addon)) return;
    const calc = calcAddonForProduct(addon);
    if (calc.totalGifted > 0) html += `<div class="subtotal-row gift-row"><span>🎁 ${addon.name} x${calc.totalGifted}<span class="gift-source">（贈品）</span></span><span>—</span></div>`;
  });
  calcPromotions().forEach(r => {
    if (r.triggered && r.giftQty > 0) html += `<div class="subtotal-row gift-row"><span>🎁 ${r.promo.giftName} x${r.giftQty}<span class="gift-source">（${r.promo.name}）</span></span><span>—</span></div>`;
  });
  return html;
}
function getSelectedItems() {
  return productsData.map((p, i) => ({ name: p.name, price: p.price, type: p.type, qty: parseInt(document.getElementById('qty_' + i)?.value || 0) })).filter(it => it.qty > 0);
}
function updateTotal() {
  let subtotal = 0, itemsHtml = '', hasItem = false;
  productsData.forEach((p, i) => {
    const qty = parseInt(document.getElementById('qty_' + i)?.value || 0);
    if (qty > 0) {
      hasItem = true;
      const sub = p.price * qty;
      subtotal += sub;
      itemsHtml += `<div class="subtotal-row"><span>${p.name} x${qty}</span><span>${sub} 元</span></div>`;
    }
  });
  document.getElementById('subtotalBox').style.display = hasItem ? 'block' : 'none';
  document.getElementById('subtotalItems').innerHTML = itemsHtml;
  document.getElementById('subtotalGifts').innerHTML = buildGiftRowsHtml();
  document.getElementById('totalAmt').innerText = subtotal + ' 元';
}

function isNoRealPhone(phone) {
  return !phone || PHONE_TAGS.indexOf(phone) >= 0;
}

async function lookupCustomer() {
  const phone = document.getElementById('phone').value.trim();
  const box = document.getElementById('customerInfo');
  if (!phone) { box.innerHTML = ''; return; }
  if (PHONE_TAGS.indexOf(phone) >= 0) {
    box.innerHTML = '<div class="hint">「' + phone + '」不是電話號碼，無法查歷史</div>';
    return;
  }
  box.innerHTML = '<div class="hint">查詢中...</div>';
  try {
    const res = await callServer('lookupCustomer', { phone });
    if (res && res.found) {
      if (!document.getElementById('name').value) document.getElementById('name').value = res.name;
      if (!document.getElementById('address').value) document.getElementById('address').value = res.address;
      box.innerHTML = `<div class="customer-info">✅ 老客戶｜上次：${res.lastOrderDate}｜累計 ${res.orderCount} 筆</div>`;
    } else {
      box.innerHTML = '<div class="customer-info">🆕 新客戶</div>';
    }
  } catch (e) { box.innerHTML = '<div class="error">查詢失敗：' + e.message + '</div>'; }
}
let isSubmitting = false;
async function submitOrder() {
  if (isSubmitting) return; // 防止重複點擊送出多筆
  const msg = document.getElementById('submitMsg');
  msg.className = 'error'; msg.textContent = '';
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const address = document.getElementById('address').value.trim();
  const orderSource = document.getElementById('orderSource').value;
  const shipping = document.getElementById('shippingSelect').value;
  const payment = document.getElementById('paymentSelect').value;
  const note = document.getElementById('note').value.trim();
  if (!name) { msg.textContent = '姓名為必填'; return; }
  if (!orderSource) { msg.textContent = '請選擇訂單來源'; return; }
  if (shipping !== '現場取貨' && !address) { msg.textContent = '宅配需要填寫地址'; return; }
  const items = getSelectedItems();
  if (items.length === 0) { msg.textContent = '請至少選擇一項商品'; return; }
  // 宅配但沒有真正的電話：提醒，但仍可送出
  if (shipping !== '現場取貨' && isNoRealPhone(phone)) {
    if (!confirm('這筆是宅配，但沒有電話號碼（寄件單會需要）。\n\n仍要送出嗎？')) return;
  }
  // lineUserId 已不使用（通知全部改手動複製），固定送空字串以相容後端
  const payload = { password: PASSWORD, name, tel: phone, address, lineUserId: '', items, addonSelections, shipping, payment, orderSource, note };
  isSubmitting = true;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerText = '送出中...';
  msg.className = 'hint';
  msg.textContent = '送出中，請稍候，不要重複點擊…';
  try {
    const res = await callServer('submitInternalOrder', payload);
    if (res && res.success) {
      msg.className = 'success';
      msg.textContent = '✅ 訂單已建立：' + res.orderId;
      setTimeout(() => { if (confirm('訂單 ' + res.orderId + ' 已建立，要繼續填下一筆嗎？')) resetForm(); }, 300);
    } else { msg.className = 'error'; msg.textContent = '失敗：' + (res.error || '未知錯誤'); }
  } catch (e) {
    msg.className = 'error';
    msg.textContent = '送出失敗：' + e.message;
  } finally {
    isSubmitting = false;
    btn.disabled = false;
    btn.innerText = '送出訂單';
  }
}
function resetForm() {
  ['name','phone','address','note'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('orderSource').value = '';
  document.getElementById('shippingSelect').value = '現場取貨';
  document.getElementById('paymentSelect').value = '現場付款';
  document.getElementById('customerInfo').innerHTML = '';
  addonSelections = {};
  productsData.forEach((p, i) => {
    const input = document.getElementById('qty_' + i);
    if (input) input.value = 0;
    const card = document.getElementById('card_' + i);
    if (card) card.classList.remove('selected');
  });
  refreshAll();
  document.getElementById('submitMsg').textContent = '';
  window.scrollTo(0, 0);
}

function prevMonth() { calendarMonth--; if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; } renderCalendar(); }
function nextMonth() { calendarMonth++; if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; } renderCalendar(); }

// 訂單狀態 → 顏色分類（圓點與月曆色條共用）
function orderDotKind(o) {
  if (o.done) return 'done';
  return o.paid ? 'paid' : 'unpaid';
}
function shipIcon(o) {
  return o.shipping !== '現場取貨' ? '🚚 ' : '';
}

function renderCalendar() {
  document.getElementById('calendarTitle').innerText = `${calendarYear} 年 ${calendarMonth + 1} 月`;
  const firstDay = new Date(calendarYear, calendarMonth, 1);
  const lastDay = new Date(calendarYear, calendarMonth + 1, 0);
  const startWeekday = firstDay.getDay();
  const daysInMonth = lastDay.getDate();
  const prevMonthLastDay = new Date(calendarYear, calendarMonth, 0).getDate();
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const scheduledByDate = {};
  (scheduleData.scheduled || []).forEach(o => {
    if (!scheduledByDate[o.pickupDate]) scheduledByDate[o.pickupDate] = [];
    scheduledByDate[o.pickupDate].push(o);
  });
  const grid = document.getElementById('calendarGrid');
  let html = '';
  const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
  for (let i = 0; i < totalCells; i++) {
    let dayNum, isOtherMonth = false, dateObj;
    if (i < startWeekday) {
      dayNum = prevMonthLastDay - (startWeekday - 1 - i);
      isOtherMonth = true;
      dateObj = new Date(calendarYear, calendarMonth - 1, dayNum);
    } else if (i >= startWeekday + daysInMonth) {
      dayNum = i - startWeekday - daysInMonth + 1;
      isOtherMonth = true;
      dateObj = new Date(calendarYear, calendarMonth + 1, dayNum);
    } else {
      dayNum = i - startWeekday + 1;
      dateObj = new Date(calendarYear, calendarMonth, dayNum);
    }
    const dateStr = formatDateStr(dateObj);
    const isToday = dateObj.getTime() === today.getTime();
    const ordersHere = scheduledByDate[dateStr] || [];
    const classes = ['day-cell'];
    if (isOtherMonth) classes.push('other-month');
    if (isToday) classes.push('today');
    if (selectedOrderId) classes.push('target-mode');
    let chips = '';
    ordersHere.forEach(o => {
      const idShort = o.orderId.slice(-3);
      const kind = orderDotKind(o);
      const chipCls = kind === 'unpaid' ? '' : ' ' + kind;
      chips += `<div class="day-order-chip${chipCls}" onclick="event.stopPropagation();openOrderDetail('${o.orderId}')" title="${o.name}｜${o.shipping}">${shipIcon(o)}${idShort} ${o.name}</div>`;
    });
    // 產量 -> 百分比決定淡色背景(不顯示文字數字,避免畫面混亂)
    const load = (scheduleData.dailyLoad && scheduleData.dailyLoad[dateStr]) || {};
    const caps = scheduleData.dailyCapacity || {};
    const totalCap = scheduleData.totalCapacity || 0;
    let totalCur = 0;
    Object.keys(load).forEach(f => { totalCur += load[f] || 0; });
    let maxPercent = 0;
    Object.keys(caps).forEach(flavor => {
      const cur = load[flavor] || 0;
      const max = caps[flavor];
      if (!max) return;
      const percent = cur / max * 100;
      if (percent > maxPercent) maxPercent = percent;
    });
    if (totalCap) {
      const tPercent = totalCur / totalCap * 100;
      if (tPercent > maxPercent) maxPercent = tPercent;
    }
    if (maxPercent > 100) classes.push('load-over');
    else if (maxPercent > 85) classes.push('load-high');
    else if (maxPercent > 60) classes.push('load-mid');
    else if (maxPercent > 0) classes.push('load-low');
    html += `<div class="${classes.join(' ')}" onclick="onDayClick('${dateStr}')"><div class="day-number">${dayNum}</div><div class="day-orders">${chips}</div></div>`;
  }
  grid.innerHTML = html;
}
function formatDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}
function onDayClick(dateStr) {
  if (selectedOrderId) {
    const order = findOrder(selectedOrderId);
    if (!order) return;
    pendingDate = dateStr;
    document.getElementById('periodModalInfo').innerHTML = `將「${order.name}」（${order.orderId.slice(-3)}）<br>排定到 <b>${dateStr}</b>`;
    document.getElementById('periodModalMsg').textContent = '';
    document.getElementById('periodModal').classList.add('show');
    return;
  }
  openDayDetail(dateStr);
}

/* ===== 當日明細：口味 × 盒型 盒數統計 ===== */

// 盒型名稱取自商品名稱的第二段，例如「杏仁手工餅乾 家庭號 700g」→「家庭號」
function boxLabel(p) {
  const parts = String(p.name || '').trim().split(/\s+/);
  return parts[1] || p.type || p.name;
}
function splitItemLines(s) {
  return String(s || '').split(/\n|\\n/);
}
function capColor(percent) {
  return percent > 100 ? '#c00' : percent > 85 ? '#c33' : percent > 60 ? '#f80' : '#4a4';
}

// 回傳 { 口味: { 盒型: 盒數 } }，依訂單品項字串「商品名 x數量 (金額元)」加總
function calcDayBoxes(orders) {
  const prodMap = {};
  productsData.forEach(p => { prodMap[p.name] = p; });
  const result = {};
  orders.forEach(o => {
    splitItemLines(o.items).forEach(line => {
      const m = line.trim().match(/^(.+?)\s+x(\d+)/);
      if (!m) return;
      const prodName = m[1].trim();
      const qty = parseInt(m[2]) || 0;
      if (!qty) return;
      const p = prodMap[prodName];
      const flavor = (p && p.flavor) || '其他';
      const label = p ? boxLabel(p) : prodName; // 找不到商品(已改名/下架)就直接顯示原名
      if (!result[flavor]) result[flavor] = {};
      result[flavor][label] = (result[flavor][label] || 0) + qty;
    });
  });
  return result;
}

function buildDaySummaryHtml(dateStr, orders) {
  // 左：客人
  const leftHtml = orders.map(o => {
    const color = DOT_COLORS[orderDotKind(o)];
    return `<div class="cust-chip" onclick="closeDayDetail();openOrderDetail('${o.orderId}')" title="${o.name}｜${o.shipping}"><span class="cust-dot" style="background:${color}"></span><span class="cust-name">${shipIcon(o)}${o.name}</span></div>`;
  }).join('');

  // 右：口味卡片
  const boxes = calcDayBoxes(orders);
  const load = (scheduleData.dailyLoad && scheduleData.dailyLoad[dateStr]) || {};
  const caps = scheduleData.dailyCapacity || {};
  const totalCap = scheduleData.totalCapacity || 0;

  // 口味順序：先照產能設定的順序，再補其他
  const flavorOrder = Object.keys(caps);
  Object.keys(boxes).forEach(f => { if (flavorOrder.indexOf(f) < 0) flavorOrder.push(f); });
  Object.keys(load).forEach(f => { if (flavorOrder.indexOf(f) < 0) flavorOrder.push(f); });

  let rightHtml = '';
  flavorOrder.forEach(flavor => {
    const fb = boxes[flavor] || {};
    const cur = load[flavor] || 0;
    if (Object.keys(fb).length === 0 && cur === 0) return; // 當天沒有這個口味就不顯示
    const rows = Object.keys(fb).map(label => `<div class="box-row"><span>${label}</span><span class="box-qty">${fb[label]}</span></div>`).join('');
    let capHtml = '';
    const max = caps[flavor];
    if (max) {
      const percent = Math.round(cur / max * 100);
      capHtml = `<div class="flavor-cap" style="color:${capColor(percent)}">${cur} / ${max} 片</div>`;
    } else if (cur > 0) {
      capHtml = `<div class="flavor-cap" style="color:#666">${cur} 片</div>`;
    }
    rightHtml += `<div class="flavor-card" style="background:${flavorColor(flavor)}"><div class="flavor-main"><div class="flavor-name">${Array.from(String(flavor)).map(c => `<span>${c}</span>`).join('')}</div><div class="flavor-boxes">${rows}</div></div>${capHtml}</div>`;
  });

  // 總計片數
  let totalHtml = '';
  if (totalCap) {
    let totalCur = 0;
    Object.keys(load).forEach(f => { totalCur += load[f] || 0; });
    const tPercent = Math.round(totalCur / totalCap * 100);
    totalHtml = `<div class="day-total-cap" style="color:${capColor(tPercent)}">總計　${totalCur} / ${totalCap} 片</div>`;
  }

  const legend = `<div class="dot-legend"><span><i style="background:${DOT_COLORS.unpaid}"></i>未匯款</span><span><i style="background:${DOT_COLORS.paid}"></i>已匯款</span><span><i style="background:${DOT_COLORS.done}"></i>已完成</span><span>🚚 宅配</span></div>`;

  return `<div class="day-summary"><div class="day-sum-left">${leftHtml}</div><div class="day-sum-right">${rightHtml}${totalHtml}</div></div>${legend}`;
}

function openDayDetail(dateStr) {
  const orders = (scheduleData.scheduled || []).filter(o => o.pickupDate === dateStr);
  document.getElementById('dayDetailTitle').innerText = dateStr + ' 排定訂單';
  const summaryBox = document.getElementById('dayDetailSummary');

  if (orders.length === 0) {
    summaryBox.innerHTML = '';
    document.getElementById('dayDetailList').innerHTML = '<div class="hint" style="padding:10px 0">這天還沒有排定的訂單</div>';
  } else {
    summaryBox.innerHTML = buildDaySummaryHtml(dateStr, orders);
    const html = orders.map(o => {
      const idShort = o.orderId.slice(-3);
      const shipTag = o.shipping === '現場取貨' ? `<span class="order-card-tag pickup">${o.shipping}</span>` : `<span class="order-card-tag ship">${o.shipping}</span>`;
      const confirmedTag = o.done
        ? `<span class="order-card-tag">已完成</span>`
        : (o.paid ? `<span class="order-card-tag" style="background:#e8f5e9;color:#4caf50">已匯款</span>` : `<span class="order-card-tag" style="background:#fff3e0;color:#e65100">未匯款</span>`);
      const noteBadge = o.scheduleNote ? `<div style="font-size:11px;color:#D32F2F;background:#fff5f5;padding:4px 8px;border-radius:4px;margin-top:4px">📝 ${o.scheduleNote}</div>` : '';
      return `<div class="order-card" onclick="closeDayDetail();openOrderDetail('${o.orderId}')"><div class="order-card-header"><span class="order-card-id">#${idShort}</span><span style="display:flex;gap:6px;align-items:center">${shipTag}${confirmedTag}</span></div><div class="order-card-name">${o.name}${o.pickupPeriod ? '　' + o.pickupPeriod : ''}</div><div class="order-card-items">${o.items.split('\n').join('｜')}</div>${noteBadge}</div>`;
    }).join('');
    document.getElementById('dayDetailList').innerHTML = html;
  }
  document.getElementById('dayDetailModal').classList.add('show');
}

function closeDayDetail(event) {
  document.getElementById('dayDetailModal').classList.remove('show');
}
function findOrder(orderId) {
  let o = (scheduleData.unscheduled || []).find(x => x.orderId === orderId);
  if (o) return o;
  return (scheduleData.scheduled || []).find(x => x.orderId === orderId);
}
function renderUnscheduled() {
  const list = scheduleData.unscheduled || [];
  document.getElementById('unscheduledCount').innerText = `（${list.length} 筆）`;
  const box = document.getElementById('unscheduledList');
  if (list.length === 0) { box.innerHTML = '<div class="hint">目前沒有待排定的訂單 ✨</div>'; return; }
  box.innerHTML = list.map(o => {
    const idShort = o.orderId.slice(-3);
    const shipTag = o.shipping === '現場取貨' ? `<span class="order-card-tag pickup">${o.shipping}</span>` : `<span class="order-card-tag ship">${o.shipping}</span>`;
    const sel = (selectedOrderId === o.orderId) ? ' selected' : '';
    const noteBadge = o.scheduleNote ? `<div style="font-size:11px;color:#D32F2F;background:#fff5f5;padding:4px 8px;border-radius:4px;margin-top:4px">📝 ${o.scheduleNote}</div>` : '';
    return `<div class="order-card${sel}" onclick="selectOrder('${o.orderId}')"><div class="order-card-header"><span class="order-card-id">#${idShort}</span><span style="display:flex;gap:6px;align-items:center">${shipTag}<span class="info-btn-sm" onclick="event.stopPropagation();openOrderDetail('${o.orderId}')">ⓘ</span></span></div><div class="order-card-name">${o.name}</div><div class="order-card-items">${o.items.split('\\n').slice(0, 2).join('｜')}</div>${noteBadge}</div>`;
  }).join('');
}
function selectOrder(orderId) {
  selectedOrderId = (selectedOrderId === orderId) ? null : orderId;
  document.getElementById('scheduleHint').innerText = selectedOrderId ? '👇 已選取訂單，請點月曆日期排定（再次點訂單可取消選擇）' : '點訂單卡片，再點月曆日期即可排定（點 ⓘ 看詳情）';
  renderUnscheduled();
  renderCalendar();
}
function closePeriodModal(event) {
  document.getElementById('periodModal').classList.remove('show');
  pendingDate = null;
}
async function confirmSchedule() {
  if (!selectedOrderId || !pendingDate) return;
  const period = document.getElementById('periodSelect').value;
  const msg = document.getElementById('periodModalMsg');
  msg.textContent = '處理中...';
  try {
    const res = await callServer('setOrderPickupDate', { password: PASSWORD, orderId: selectedOrderId, pickupDate: pendingDate, pickupPeriod: period });
    if (res && res.success) {
      closePeriodModal();
      selectedOrderId = null;
      await loadSchedule();
    } else { msg.textContent = '失敗：' + (res.error || '未知錯誤'); }
  } catch (e) { msg.textContent = '失敗：' + e.message; }
}

/* ===== 訂單詳情 + 狀態管理 + 訊息範本 ===== */
function openOrderDetail(orderId) {
  const o = findOrder(orderId);
  if (!o) return;
  detailOrder = o;
  document.getElementById('detailTitle').innerText = `#${o.orderId.slice(-3)}｜${o.name}`;
  const lines = [];
  lines.push(`<b>訂單編號：</b>${o.orderId}`);
  lines.push(`<b>電話：</b>${o.tel}`);
  lines.push(`<b>運送：</b>${o.shipping}`);
  if (o.address) lines.push(`<b>地址：</b>${o.address}`);
  lines.push(`<b>付款方式：</b>${o.payment}`);
  lines.push(`<b>總額：</b>${fmtMoney(o.total)} 元`);
  lines.push(`<b>商品：</b>${buildItemListHtml(o.items)}`);
  if (o.addons) lines.push(`<b>贈品/加購：</b><br>${splitItemLines(o.addons).filter(x => x.trim()).join('<br>')}`);
  if (o.note) lines.push(`<b>備註：</b>${o.note}`);
  document.getElementById('detailInfo').innerHTML = lines.join('<br>').replace(/<\/div><br>/g, '</div>');
  document.getElementById('editItemsSection').style.display = 'none';
  const pickupHtml = o.pickupDate
    ? `<div class="pickup-display">📅 <b>${o.pickupDate}</b> ${o.pickupPeriod || ''}<div style="margin-top:6px;display:flex;gap:6px"><button class="small outline" onclick="reschedule()">改日期</button><button class="small gray" onclick="cancelSchedule()">取消排定</button></div></div>`
    : `<div class="pickup-display" style="background:#fafafa;color:#888">尚未排定取貨日期</div>`;
  document.getElementById('detailPickup').innerHTML = pickupHtml;
  renderStatusControls(o);
  document.getElementById('detailMsg').textContent = '';
  document.getElementById('orderDetailModal').classList.add('show');
}

function fmtMoney(n) {
  const num = Number(n);
  return isNaN(num) ? n : num.toLocaleString('en-US');
}

// 商品列：口味色塊｜盒型｜× 數量｜金額。對不到商品資料的行就原樣顯示
function buildItemListHtml(itemsStr) {
  const prodMap = {};
  productsData.forEach(p => { prodMap[p.name] = p; });
  const rows = splitItemLines(itemsStr).map(line => line.trim()).filter(x => x).map(line => {
    const m = line.match(/^(.+?)\s+x(\d+)(?:\s*[（(]\s*(\d+)\s*元\s*[)）])?/);
    if (!m) return `<div class="item-row"><span class="item-box">${line}</span></div>`;
    const prodName = m[1].trim();
    const p = prodMap[prodName];
    const amt = m[3] ? `<span class="item-amt">${fmtMoney(m[3])} 元</span>` : '';
    if (!p) return `<div class="item-row"><span class="item-box">${prodName}</span><span class="item-qty">× ${m[2]}</span>${amt}</div>`;
    const flavor = p.flavor || '其他';
    return `<div class="item-row"><span class="flavor-pill" style="background:${flavorColor(flavor)}">${flavor}</span><span class="item-box">${boxLabel(p)}</span><span class="item-qty">× ${m[2]}</span>${amt}</div>`;
  });
  return `<div class="item-list">${rows.join('')}</div>`;
}

// 自取：已匯款、訂單完成；宅配：已匯款、已出貨、訂單完成
function renderStatusControls(o) {
  let html = [];
  html.push(checkboxHtml('paid', '💰 已匯款', o.paid));
  if (o.shipping !== '現場取貨') html.push(checkboxHtml('shipped', '🚚 已出貨', o.shipped));
  html.push(checkboxHtml('done', '🎉 訂單完成', o.done));
  document.getElementById('statusControls').innerHTML = html.join('');
}

function checkboxHtml(key, label, checked) {
  return `<label class="status-checkbox"><input type="checkbox" id="ts_${key}" ${checked ? 'checked' : ''} onchange="saveStatus('${key}', this.checked)"><span>${label}</span></label>`;
}

async function saveStatus(key, value) {
  if (!detailOrder) return;
  const msg = document.getElementById('detailMsg');
  msg.className = 'hint';
  msg.textContent = '儲存中...';
  const updates = {};
  updates[key] = value;
  try {
    const res = await callServer('updateOrderStatus', { password: PASSWORD, orderId: detailOrder.orderId, updates });
    if (res && res.success) {
      msg.className = 'success';
      msg.textContent = '✅ 已儲存';
      const refreshed = await callServer('getScheduleData', {});
      if (refreshed && !refreshed.error) {
        scheduleData = refreshed;
        renderPrepAlert();
        renderCalendar();
        renderUnscheduled();
        const updated = findOrder(detailOrder.orderId);
        if (updated) detailOrder = updated;
      }
      setTimeout(() => { if (document.getElementById('detailMsg').textContent.indexOf('✅ 已儲存') === 0) document.getElementById('detailMsg').textContent = ''; }, 3500);
    } else {
      msg.className = 'error';
      msg.textContent = '失敗：' + (res.error || '未知錯誤');
    }
  } catch (e) {
    msg.className = 'error';
    msg.textContent = '失敗：' + e.message;
  }
}

/* ===== 訂單內容編輯（商品/數量/備註，金額自動重算） ===== */
function toggleEditItems() {
  if (!detailOrder) return;
  const sec = document.getElementById('editItemsSection');
  const show = sec.style.display === 'none';
  sec.style.display = show ? 'block' : 'none';
  if (show) openEditItems();
}

function parseOrderItemsForEdit(itemsStr) {
  // 逐行解析「商品名 x數量 (金額元)」格式，取商品名與數量
  const map = {};
  (itemsStr || '').split('\n').forEach(line => {
    const m = line.match(/^(.+?)\s+x(\d+)/);
    if (m) map[m[1].trim()] = parseInt(m[2]) || 0;
  });
  return map;
}

function openEditItems() {
  const qtyMap = parseOrderItemsForEdit(detailOrder.items);
  const grid = document.getElementById('editProductGrid');
  grid.innerHTML = '';
  productsData.forEach((p, i) => {
    const qty = qtyMap[p.name] || 0;
    const maxAttr = p.maxQty > 0 ? `max="${p.maxQty}"` : '';
    grid.innerHTML += `<div class="product-card${qty > 0 ? ' selected' : ''}" id="editCard_${i}"><div class="product-info"><div class="product-name">${p.name}</div><div class="product-price">NT$ ${p.price}</div><div class="qty-row"><button class="qty-btn" onclick="editChangeQty(${i},-1)">－</button><input class="qty-input" id="editQty_${i}" type="number" value="${qty}" min="0" ${maxAttr} onchange="editOnQtyChange(${i})"><button class="qty-btn" onclick="editChangeQty(${i},1)">＋</button></div></div></div>`;
  });
  document.getElementById('editNote').value = detailOrder.note || '';
  document.getElementById('editItemsMsg').textContent = '';
  updateEditTotal();
}

function editChangeQty(i, delta) {
  const input = document.getElementById('editQty_' + i);
  const max = productsData[i].maxQty;
  let val = Math.max(0, parseInt(input.value || 0) + delta);
  if (max > 0) val = Math.min(val, max);
  input.value = val;
  document.getElementById('editCard_' + i).classList.toggle('selected', val > 0);
  updateEditTotal();
}
function editOnQtyChange(i) {
  const input = document.getElementById('editQty_' + i);
  const max = productsData[i].maxQty;
  let val = parseInt(input.value);
  if (isNaN(val) || val < 0) val = 0;
  if (max > 0 && val > max) val = max;
  input.value = val;
  document.getElementById('editCard_' + i).classList.toggle('selected', val > 0);
  updateEditTotal();
}
function getEditSelectedItems() {
  return productsData.map((p, i) => ({ name: p.name, price: p.price, type: p.type, qty: parseInt(document.getElementById('editQty_' + i)?.value || 0) })).filter(it => it.qty > 0);
}
function updateEditTotal() {
  const items = getEditSelectedItems();
  let subtotal = 0, html = '';
  items.forEach(it => {
    const sub = it.price * it.qty;
    subtotal += sub;
    html += `<div class="subtotal-row"><span>${it.name} x${it.qty}</span><span>${sub} 元</span></div>`;
  });
  html += `<div class="subtotal-row subtotal-total"><span>新小計</span><span>${subtotal} 元</span></div>`;
  html += `<div class="hint">⚠️ 贈品/優惠與運費將依新數量自動重算，儲存後於上方訂單詳情顯示最新結果</div>`;
  document.getElementById('editSubtotalBox').innerHTML = html;
}
function cancelEditItems() {
  document.getElementById('editItemsSection').style.display = 'none';
}
async function saveEditItems() {
  if (!detailOrder) return;
  const items = getEditSelectedItems();
  const msg = document.getElementById('editItemsMsg');
  if (items.length === 0) { msg.className = 'error'; msg.textContent = '請至少選擇一項商品'; return; }
  msg.className = 'hint';
  msg.textContent = '儲存中...';
  try {
    const res = await callServer('updateOrderItems', {
      password: PASSWORD,
      orderId: detailOrder.orderId,
      items,
      note: document.getElementById('editNote').value.trim()
    });
    if (res && res.success) {
      msg.className = 'success';
      msg.textContent = '✅ 已更新訂單內容';
      const refreshed = await callServer('getScheduleData', {});
      if (refreshed && !refreshed.error) {
        scheduleData = refreshed;
        renderPrepAlert();
        renderCalendar();
        renderUnscheduled();
      }
      setTimeout(() => { openOrderDetail(detailOrder.orderId); }, 400);
    } else {
      msg.className = 'error';
      msg.textContent = '失敗：' + (res.error || '未知錯誤');
    }
  } catch (e) {
    msg.className = 'error';
    msg.textContent = '失敗：' + e.message;
  }
}

function closeOrderDetail(event) {
  document.getElementById('orderDetailModal').classList.remove('show');
  document.getElementById('editItemsSection').style.display = 'none';
  detailOrder = null;
}
function reschedule() {
  if (!detailOrder) return;
  selectedOrderId = detailOrder.orderId;
  closeOrderDetail();
  document.getElementById('scheduleHint').innerText = '👇 請點月曆日期重新排定';
  renderUnscheduled();
  renderCalendar();
  alert('已選取訂單，請點月曆日期重新排定');
}
async function cancelSchedule() {
  if (!detailOrder) return;
  if (!confirm('確定取消「' + detailOrder.name + '」的排定？')) return;
  const msg = document.getElementById('detailMsg');
  msg.textContent = '處理中...';
  try {
    const res = await callServer('setOrderPickupDate', { password: PASSWORD, orderId: detailOrder.orderId, pickupDate: '', pickupPeriod: '' });
    if (res && res.success) { closeOrderDetail(); await loadSchedule(); }
    else { msg.textContent = '失敗：' + (res.error || '未知錯誤'); }
  } catch (e) { msg.textContent = '失敗：' + e.message; }
}

async function callServer(action, params, retriesLeft) {
  if (retriesLeft === undefined) retriesLeft = 2; // 最多重試 2 次(總共嘗試 3 次)
  const url = SCRIPT_URL + '?action=' + encodeURIComponent(action);
  const res = await fetch(url, { method: 'POST', body: JSON.stringify(params || {}), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
  const text = await res.text();
  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    // 判斷是否為 Google 端偶發的異常流量驗證頁(非我們自己的回應)。
    // 這種情況代表我們的 doPost 這次根本沒被執行到，重試是安全的，不會造成重複訂單。
    const looksLikeGooglePage = text.indexOf('ppConfig') !== -1 || text.trim().indexOf('<!DOCTYPE html') === 0;
    if (looksLikeGooglePage && retriesLeft > 0) {
      await new Promise(r => setTimeout(r, 1200));
      return callServer(action, params, retriesLeft - 1);
    }
    throw new Error('回應格式錯誤：' + text.slice(0, 200));
  }
  if (data.status === 'ERROR') throw new Error(data.message);
  return data.result !== undefined ? data.result : data;
}
